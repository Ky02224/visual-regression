name: Propose merge for chore/improvements

# This workflow used to merge branches straight into main with no review, via
# the /merges API. Two things made that unsafe:
#
#   1. cd.yml publishes whatever lands on main as the `latest` GHCR image, so an
#      auto-merge was also an auto-release with no human in the loop.
#   2. A second job merged the hardcoded, unrelated branch fix/dashboard-metrics
#      whenever chore/improvements was pushed — a branch the trigger had nothing
#      to do with.
#
# It now opens a pull request instead. The automation still saves the manual
# step, but main only changes after a review, and the PR carries the test
# results so the reviewer can see what they are approving.

on:
  push:
    branches: [ "chore/improvements" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        timeout-minutes: 12
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Python tests
        timeout-minutes: 20
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: dashboard_frontend/package-lock.json

      # `npm ci` installs exactly the committed lockfile. The previous
      # `rm -rf package-lock.json && npm install` resolved a fresh dependency
      # tree on every run, so CI never tested the versions the repo pins and the
      # audit result could differ run to run.
      - name: Install frontend dependencies
        working-directory: dashboard_frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: dashboard_frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: dashboard_frontend
        run: npm run test

      - name: Build frontend
        working-directory: dashboard_frontend
        run: npm run build

      - name: Run npm audit
        working-directory: dashboard_frontend
        # See ci.yml for rationale: the only remaining advisory is an RSC-mode
        # CSRF bypass (GHSA-qwww-vcr4-c8h2) that doesn't apply to this SPA.
        run: npm audit --audit-level=critical

      - name: Open or update a pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head chore/improvements --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for chore/improvements — tests re-ran against the new commit."
            exit 0
          fi
          gh pr create \
            --base main \
            --head chore/improvements \
            --title "chore: merge chore/improvements into main" \
            --body "Opened automatically after tests passed on \`chore/improvements\` (${GITHUB_SHA}).

          Python tests, frontend typecheck, unit tests, build and npm audit all passed.

          Review and merge manually — \`cd.yml\` publishes whatever lands on main as the \`latest\` image."
