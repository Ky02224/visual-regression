name: Visual Regression CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard_frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard_frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Run Frontend Tests
        run: npm run test

      - name: Build
        run: npm run build

  visual-test:
    name: Run Headless Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A baseline captured from the very commit under test and then compared
      # against that same commit always matches, so a run with no committed
      # baselines cannot fail no matter what changed. Surface that as a warning
      # on the run summary instead of reporting a green check that proves
      # nothing. See the "Generate Baselines" workflow for how to produce
      # Linux-captured baselines worth committing.
      - name: Check Baseline Provenance
        run: |
          if [ -n "$(ls -A .visual-regression/baselines 2>/dev/null)" ]; then
            echo "Using committed baselines — comparison is meaningful."
          else
            echo "::warning title=Visual check is self-comparing::No committed baselines found, so baselines are captured from this commit and compared against themselves. This run CANNOT detect a visual regression. Run the 'Generate Baselines' workflow, then commit .visual-regression/baselines/."
          fi

      # suite.ci-smoke.yaml asks for comparison_mode: ai, but the trained model
      # lives under the ignored workspace and is far too large to commit, so it
      # is never present here. resolve_ai_model_path() then returns None and
      # decision.py falls back to pixel with decision_source
      # "pixel-fallback-no-model". That is recorded per result but nothing reads
      # it, so the job goes green while the AI never ran. Say so out loud rather
      # than let a green check imply the model was exercised.
      - name: Check AI Model Availability
        run: |
          if [ -f .visual-regression/models/visual_ai.pt ]; then
            echo "AI model present — the suite's ai comparison mode will actually run."
          else
            echo "::warning title=AI comparison not exercised::No model at .visual-regression/models/visual_ai.pt, so the suite falls back to pixel comparison (decision_source=pixel-fallback-no-model). This run does NOT validate the AI. Publishing the model to CI needs a distribution choice (Git LFS, a release asset, or a restored cache)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Python Dependencies
        timeout-minutes: 12
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Create Workspace Directories
        timeout-minutes: 2
        run: |
          python -c "from visual_regression.config import WorkspacePaths; WorkspacePaths().ensure()"

      - name: Run Python Test Suite
        timeout-minutes: 15
        run: |
          python -m pytest -q

      - name: Start Dashboard Server
        timeout-minutes: 3
        # Output is redirected to a file: a backgrounded process that keeps the
        # step's stdout pipe open can stall the runner instead of letting the
        # step complete.
        run: |
          nohup python -m visual_regression.cli serve-dashboard --port 8130 > dashboard-server.log 2>&1 &
          echo "server pid=$!"

      - name: Wait For Dashboard Demo
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8130/demo/index.html", timeout=3)
                  print("Dashboard demo ready.")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Dashboard demo did not become ready in time.")
          PY

      - name: Bootstrap Missing Baselines
        timeout-minutes: 8
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m visual_regression.cli create-suite-baselines --suite suite.ci-smoke.yaml
          echo "--- baseline tree after bootstrap ---"
          find .visual-regression -type f | head -50
          echo "--- file count: $(find .visual-regression -type f | wc -l) ---"

      - name: Run Test Suite
        id: run_tests
        # Runs a lightweight 3-case subset (suite.ci-smoke.yaml) instead of the
        # full suite.demo.yaml — GitHub's shared CPU runners have no GPU, and the
        # full 12-case suite (each doing real CNN inference) was taking 30+
        # minutes here. suite.demo.yaml remains the full suite for local/dashboard use.
        # If there are visual regressions, this step exits with code 1.
        #
        # This step has hung on the runner while finishing in ~30s locally, with
        # no output past "Shared browser processes stopped". Two things make that
        # diagnosable. PYTHONUNBUFFERED/-u, because progress is printed to stdout
        # and a pipe is block-buffered, so a hang looks like total silence even
        # where work did happen. And faulthandler.dump_traceback_later, which
        # prints a traceback for every thread once the deadline passes, naming
        # the exact frame that is stuck. It is used in preference to sending a
        # signal because it needs no signal delivery to work.
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PY'
          import faulthandler, runpy, sys

          # Well inside the 15 minute step budget, so the dump reaches the log
          # instead of the runner killing the process first.
          faulthandler.dump_traceback_later(600, exit=True)

          sys.argv = [
              "visual_regression.cli",
              "run-suite",
              "--suite", "suite.ci-smoke.yaml",
              "--create-missing-baseline",
          ]
          runpy.run_module("visual_regression.cli", run_name="__main__")
          PY

      - name: Dump Dashboard Server Log
        if: always()
        run: |
          echo "--- dashboard-server.log ---"
          cat dashboard-server.log 2>/dev/null || echo "(no server log produced)"

      - name: Generate PR Markdown Comment
        if: failure() && github.event_name == 'pull_request'
        run: |
          python -m visual_regression.cli generate-pr-comment > pr_comment.md

      - name: Post Visual Diff Comment to PR
        if: failure() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message-path: pr_comment.md

      - name: Upload Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: .visual-regression/
