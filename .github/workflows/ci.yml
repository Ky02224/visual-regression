name: CI

on:
  # Branch prefixes were an allowlist, so work on any other prefix (test/*,
  # docs/*, a bare branch name) pushed with no CI at all. Run on every push
  # instead and let `concurrency` below cancel superseded runs.
  push:
  pull_request:
    branches: [ main ]

# Cancel any older, still-running run for the same branch/PR when a new
# commit lands, instead of letting stale runs pile up and hog concurrency
# slots (which delays the newest run's queue time).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: [3.11]
        # 20, not 18. vitest 4 declares engines ^20 || ^22 || >=24 and jsdom 29
        # declares ^20.19 || ^22.13 || >=24 — on Node 18 the suite does not fail
        # a test, it fails to start: jsdom's html-encoding-sniffer require()s a
        # pure-ESM package and every worker dies with ERR_REQUIRE_ESM.
        # Dockerfile and visual-test.yml were already on 20; this was the
        # straggler.
        node-version: [20]

    # tests/test_postgres_store_live.py skips itself when no server answers, and
    # nothing here started one — so the PostgreSQL backend, an advertised
    # feature backed by 700 lines of its own store implementation, had never
    # actually run in CI. This service makes those parity tests execute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LENS_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/lens_test

    steps:
      - uses: actions/checkout@v4
        with:
          # Without this the quantised model checks out as a text pointer file
          # rather than the ONNX itself, and the AI smoke step below would fail
          # on a file that looks present but is 130 bytes of metadata.
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt', 'dashboard_frontend/package-lock.json') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit
          playwright install --with-deps chromium

      # Narrow rule set (see ruff.toml): bug-catching rules only, so a failure
      # here means something is actually wrong rather than unfashionable.
      - name: Lint Python
        run: python -m ruff check .

      # Fails loudly if the Postgres parity tests silently skip again — the
      # whole point of the service above is that they run.
      - name: Verify the Postgres parity tests are not skipping
        run: |
          python -m pytest tests/test_postgres_store_live.py -q --no-header -rs 2>&1 | tee pg.log
          if grep -q "No reachable Postgres" pg.log; then
            echo "::error title=Postgres tests skipped::The postgres service did not come up, so the PostgreSQL backend went untested."
            exit 1
          fi

      - name: Run Python tests
        run: |
          python -m pytest -q \
            --junitxml=reports/pytest-junit.xml \
            --cov=visual_regression \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/coverage.xml

      - name: Run pip-audit
        run: |
          python -m pip_audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: dashboard_frontend/package-lock.json

      # `npm ci` installs exactly the committed lockfile. The previous
      # `rm -rf node_modules package-lock.json && npm install` threw the lockfile
      # away and re-resolved the tree on every run, so CI never actually tested
      # the versions this repo pins, and the npm audit result could change
      # between two runs of the same commit.
      - name: Install frontend dependencies
        working-directory: dashboard_frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: dashboard_frontend
        run: npm run lint

      # The vitest suite existed but only ran in visual-test.yml, which triggers
      # on main/master alone — so on every feature branch these tests never ran.
      - name: Run frontend unit tests
        working-directory: dashboard_frontend
        run: npm run test

      - name: Build frontend
        working-directory: dashboard_frontend
        run: npm run build

      # The SDK is a separate package that nothing else imports, so nothing was
      # compiling it — it sat broken (TS2347 on the require()'d test.extend)
      # with no way for anyone to notice. Build it here so it stays working.
      - name: Build Playwright SDK
        working-directory: sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run npm audit
        working-directory: dashboard_frontend
        # react-router-dom is pinned to the latest available version (7.18.2).
        # The only remaining advisory (GHSA-qwww-vcr4-c8h2, high) is an RSC-mode
        # CSRF bypass with no fix published upstream yet; this app is a plain
        # client-side SPA and does not use React Server Components, so it does
        # not apply. Threshold raised to critical until a patched release exists.
        run: npm audit --audit-level=critical

      - name: Install Playwright
        working-directory: dashboard_frontend
        run: |
          npx playwright install --with-deps

      - name: Start backend server
        run: |
          python -m visual_regression.cli serve-dashboard --port 8130 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8130/demo/index.html?lang=en-US", timeout=3)
                  print("Dashboard server ready.")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Dashboard server did not become ready in time.")
          PY

      - name: Run Playwright E2E tests
        working-directory: dashboard_frontend
        run: npm run test:e2e

      # The positive test the suite was missing. Everything else here proves the
      # tool does not cry wolf when nothing changed; this proves it actually
      # fires when something did. Baselines come from the clean demo pages and
      # each case then loads the same page with ?defect=<mode>, so a case that
      # passes is a miss. benchmark_report.py exits non-zero on any miss or any
      # control-group false alarm.
      - name: Capture benchmark baselines (clean pages)
        timeout-minutes: 15
        run: |
          python -m visual_regression.cli create-suite-baselines \
            --suite suites/suite.benchmark.yaml --overwrite

      # --no-ai on purpose. Detection is pixel arithmetic and must gate the
      # build whether or not a model is available, so this step never depends on
      # LFS having restored one. See ADR 0004: with the model absent the
      # benchmark still detects 81/81 with 0/9 false alarms, because the
      # smallest injected defect is eleven times the threshold.
      - name: Run injected-defect benchmark
        timeout-minutes: 20
        run: |
          python -m visual_regression.cli run-suite \
            --suite suites/suite.benchmark.yaml --no-junit --no-ai || true

      - name: Score detection rate
        timeout-minutes: 5
        run: |
          python scripts/benchmark_report.py --json-out reports/benchmark-summary.json

      # Separate from the gate above, and deliberately so: this proves the AI
      # inference path executes in CI, which is a different claim from "the tool
      # detects regressions". It cannot measure accuracy — that needs the
      # labelled evaluation in reports/live-eval-summary.json — so all it
      # asserts is that a real model was loaded and used.
      #
      # decision_source is the evidence. With no model, decision.py records
      # "pixel-fallback-no-model"; the assertion below is what stops that
      # fallback from passing silently as if the AI had run.
      - name: Smoke-test the AI inference path
        timeout-minutes: 15
        run: |
          set -euo pipefail
          MODEL=.visual-regression/models/visual_ai.quant.onnx
          if [ ! -s "$MODEL" ] || head -c 40 "$MODEL" | grep -q "git-lfs"; then
            echo "::error title=Model not restored::$MODEL is missing or is still an LFS pointer. \
          Check that actions/checkout ran with lfs: true and that the file was pushed with git lfs push."
            exit 1
          fi

          python -m visual_regression.cli run-suite \
            --suite suites/suite.benchmark.yaml --no-junit \
            --ai-model "$MODEL" || true

          python - <<'PY'
          import json, sys
          from pathlib import Path

          sources = set()
          for result in Path(".visual-regression/runs").glob("*_bmk-*/result.json"):
              payload = json.loads(result.read_text(encoding="utf-8"))
              source = (payload.get("comparison_decision") or {}).get("decision_source", "")
              if source:
                  sources.add(source)

          print(f"decision sources: {sorted(sources) or 'none'}")
          if not sources:
              sys.exit("No benchmark runs recorded a decision_source.")
          if any("no-model" in s for s in sources):
              sys.exit(
                  "The AI did not run: at least one case fell back to pixel comparison "
                  "despite a model being present."
              )
          print("AI inference path executed for every benchmark case.")
          PY

      # `path: .` uploaded the entire workspace — .git, node_modules, the
      # Playwright browser cache and storage.db included. Upload only the
      # reports.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            dashboard_frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
