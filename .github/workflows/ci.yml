name: CI

on:
  push:
    branches: [ main, "fix/*", "chore/*", "feat/*" ]
  pull_request:
    branches: [ main ]

# Cancel any older, still-running run for the same branch/PR when a new
# commit lands, instead of letting stale runs pile up and hog concurrency
# slots (which delays the newest run's queue time).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: [3.11]
        node-version: [18]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt', 'dashboard_frontend/package-lock.json') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit
          playwright install --with-deps chromium

      - name: Run Python tests
        run: |
          python -m pytest -q

      - name: Run pip-audit
        run: |
          python -m pip_audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: dashboard_frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm install --no-save @tailwindcss/oxide-linux-x64-gnu@4.3.2

      - name: Build frontend
        working-directory: dashboard_frontend
        run: npm run build

      - name: Run npm audit
        working-directory: dashboard_frontend
        # react-router-dom is pinned to the latest available version (7.18.2).
        # The only remaining advisory (GHSA-qwww-vcr4-c8h2, high) is an RSC-mode
        # CSRF bypass with no fix published upstream yet; this app is a plain
        # client-side SPA and does not use React Server Components, so it does
        # not apply. Threshold raised to critical until a patched release exists.
        run: npm audit --audit-level=critical

      - name: Install Playwright
        working-directory: dashboard_frontend
        run: |
          npx playwright install --with-deps

      - name: Start backend server
        run: |
          python -m visual_regression.cli serve-dashboard --port 8130 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8130/demo/index.html?lang=en-US", timeout=3)
                  print("Dashboard server ready.")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Dashboard server did not become ready in time.")
          PY

      - name: Run Playwright E2E tests
        working-directory: dashboard_frontend
        run: npm run test:e2e

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: .
