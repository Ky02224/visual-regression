name: visual-regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  visual-test:
    runs-on: self-hosted   # <-- runs on YOUR machine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Start demo portal
        run: Start-Process python -ArgumentList "-m visual_regression.cli serve-demo --port 8123" -PassThru
        shell: powershell

      - name: Wait for demo portal
        shell: python
        run: |
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8123/index.html", timeout=3)
                  print("Demo portal ready."); break
              except: time.sleep(1)

      - name: Run visual regression suite
        env:
          LENS_API_KEY: ${{ secrets.LENS_API_KEY }}
        run: python -m visual_regression run-suite --suite suite.demo.yaml --no-junit
        shell: powershell

      - name: Notify dashboard on failure
        if: failure()
        shell: python
        run: |
          import urllib.request, json, os
          key = os.environ.get("LENS_API_KEY", "")
          payload = json.dumps({"event": "ci.failed", "branch": "${{ github.ref_name }}"}).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8130/api/integrations/activity",
              data=payload,
              headers={"Content-Type": "application/json", "X-Access-Key": key},
          )
          try: urllib.request.urlopen(req, timeout=5)
          except: pass

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: .visual-regression/runs/

