name: visual-regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Start dashboard server
        run: python -m visual_regression.cli serve-dashboard --port 8130 &

      - name: Wait for dashboard demo
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8130/demo/index.html", timeout=3)
                  print("Dashboard demo ready."); break
              except: time.sleep(1)
          PY

      - name: Bootstrap baselines
        run: python -m visual_regression.cli create-suite-baselines --suite suite.demo.yaml --overwrite

      - name: Run visual regression suite
        run: python -m visual_regression.cli run-suite --suite suite.demo.yaml --no-junit

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: .visual-regression/

