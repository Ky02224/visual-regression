name: visual-regression

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      recreate_baselines:
        description: 'Force recreate baselines? (yes/no)'
        required: false
        default: 'no'

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Download AI Model from Release
        run: |
          mkdir -p .visual-regression/models
          curl -L "https://github.com/Ky02224/visual-regression/releases/download/v1.0.0/visual_ai.pt" -o .visual-regression/models/visual_ai.pt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore baseline cache
        id: baseline-cache
        uses: actions/cache@v4
        with:
          path: .visual-regression/baselines
          key: baselines-${{ hashFiles('suite.demo.yaml', 'demo_portal/**') }}
          restore-keys: baselines-

      - name: Start dashboard server
        run: python -m visual_regression serve-dashboard --port 8130 &

      - name: Wait for dashboard server
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8130/api/dashboard", timeout=3)
                  print("Dashboard ready."); break
              except: time.sleep(1)
          PY

      - name: Create baselines (first run or forced)
        if: steps.baseline-cache.outputs.cache-hit != 'true' || github.event.inputs.recreate_baselines == 'yes'
        run: python -m visual_regression create-suite-baselines --suite suite.demo.yaml --overwrite

      - name: Run visual regression suite
        run: python -m visual_regression run-suite --suite suite.demo.yaml --no-junit

      - name: Generate PR Comment
        if: always()
        run: python -m visual_regression generate-pr-comment

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request' && hashFiles('pr_comment.md') != ''
        run: gh pr comment ${{ github.event.number }} --body-file pr_comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List visual regression files
        if: always()
        run: |
          echo "=== Files in workspace ==="
          ls -la
          if [ -d .visual-regression ]; then
            echo "=== Files in .visual-regression ==="
            find .visual-regression
          else
            echo ".visual-regression directory does not exist!"
          fi

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: .visual-regression

