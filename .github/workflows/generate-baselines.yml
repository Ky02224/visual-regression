name: Generate Baselines

# Captures visual-regression baselines inside the SAME Linux + Chromium
# environment the CI suites run in, then publishes them as an artifact.
#
# Why this exists: baselines captured on a developer machine (Windows, a
# different Chromium build) do not match what a GitHub runner renders — font
# rasterisation and browser version differences alone produce large diffs. A
# baseline is only a valid reference if it was captured where the comparison
# runs.
#
# Usage:
#   1. Run this workflow (Actions -> Generate Baselines -> Run workflow).
#   2. Download the "linux-baselines" artifact from the run summary.
#   3. Unzip it into .visual-regression/baselines/ and commit the result.
#      Committing them is what makes the CI visual check meaningful: without
#      committed baselines, CI captures a baseline from the commit under test
#      and compares it against itself, which can never fail.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite file to capture baselines for"
        required: true
        default: suite.ci-smoke.yaml
        type: choice
        options:
          - suite.ci-smoke.yaml
          - suite.demo.yaml

jobs:
  generate:
    name: Capture Baselines (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Python Dependencies
        timeout-minutes: 12
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Create Workspace Directories
        timeout-minutes: 2
        run: |
          python -c "from visual_regression.config import WorkspacePaths; WorkspacePaths().ensure()"

      - name: Start Dashboard Server
        timeout-minutes: 3
        run: |
          nohup python -m visual_regression.cli serve-dashboard --port 8130 > dashboard-server.log 2>&1 &
          echo "server pid=$!"

      - name: Wait For Dashboard Demo
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8130/demo/index.html", timeout=3)
                  print("Dashboard demo ready.")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Dashboard demo did not become ready in time.")
          PY

      - name: Capture Baselines
        timeout-minutes: 25
        run: |
          python -m visual_regression.cli create-suite-baselines \
            --suite "${{ inputs.suite }}" --overwrite

      - name: Dump Dashboard Server Log
        if: always()
        run: |
          echo "--- dashboard-server.log ---"
          cat dashboard-server.log 2>/dev/null || echo "(no server log produced)"

      - name: Upload Baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: .visual-regression/baselines/
          if-no-files-found: error
