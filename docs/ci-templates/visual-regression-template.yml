# ============================================================
# Visual Regression Workbench — GitHub Actions CI Template
# ============================================================
# Copy this file to your OWN project's .github/workflows/ folder.
#
# REQUIRED SECRETS (set in GitHub repo Settings → Secrets):
#   VR_SERVER_URL  — URL of your running dashboard (e.g. https://your-host:8130)
#   VR_API_KEY     — API key from the Integrations page of your dashboard
#
# HOW TO USE:
#   Option A (SDK):  Use visualSnapshot() in your Playwright tests (see sdk/README.md)
#   Option B (CLI):  Use the `run-suite` command with a suite YAML file
#
# ============================================================

name: Visual Regression

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------------
  # Option A: SDK-based (recommended) — runs your Playwright tests
  # ----------------------------------------------------------------
  visual-tests-sdk:
    name: Visual Tests (Playwright SDK)
    runs-on: ubuntu-latest
    # Remove this `if` line to enable Option A
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build VR SDK
        run: |
          cd sdk
          npm install
          npm run build

      - name: Run Playwright visual tests
        run: npx playwright test
        env:
          VR_SERVER_URL: ${{ secrets.VR_SERVER_URL }}
          VR_API_KEY: ${{ secrets.VR_API_KEY }}

  # ----------------------------------------------------------------
  # Option B: CLI-based — runs a suite YAML file
  # ----------------------------------------------------------------
  visual-tests-cli:
    name: Visual Tests (Suite CLI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so baseline diffs are accurate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # Restore cached baselines so CI has them available
      - name: Restore baseline cache
        uses: actions/cache@v4
        with:
          path: .visual-regression/baselines
          key: vr-baselines-${{ hashFiles('suite.*.yaml') }}-${{ github.base_ref || github.ref_name }}
          restore-keys: |
            vr-baselines-${{ hashFiles('suite.*.yaml') }}-
            vr-baselines-

      - name: Run visual regression suite
        id: vr_run
        run: |
          python -m visual_regression run-suite \
            --suite suite.example.yaml \
            --workers 2
        # Remove --workers if your suite is small or you get flaky results
        continue-on-error: true  # Don't block PR merge; just report status

      - name: Upload diff report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-report-${{ github.run_number }}
          path: .visual-regression/runs/
          retention-days: 14

      - name: Post GitHub commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.vr_run.outcome }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: runUrl,
              description: `Visual regression: ${state === 'success' ? 'All checks passed' : 'Changes detected'}`,
              context: 'Visual Regression Workbench'
            });

      # Optional: Save updated baselines back to cache on main branch
      - name: Save baseline cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .visual-regression/baselines
          key: vr-baselines-${{ hashFiles('suite.*.yaml') }}-${{ github.ref_name }}
