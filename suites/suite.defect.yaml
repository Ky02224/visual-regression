# Simulated visual regressions/defects for testing AI classifications
defaults:
  comparison_mode: ai

tests:
  - name: demo-home-en
    url: http://127.0.0.1:8130/demo/index.html?lang=en-US&defect=missing-cta
    browser: chromium
    viewport: [1440, 900]
    wait_ms: 400
    threshold_pct: 0.25
    pixel_threshold: 20
    min_region_area: 120
    locale: en-US
    timezone_id: Asia/Kuala_Lumpur
    ignore_regions: []

  - name: demo-login-ms
    url: http://127.0.0.1:8130/demo/login.html?lang=ms-MY&defect=misaligned-fields
